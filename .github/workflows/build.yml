name: Build Damien Music 241

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Créer la structure
        run: mkdir -p app/src/main/java/com/damienmusic/app

      - name: gradle.properties
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties

      - name: settings.gradle
        run: |
          printf 'rootProject.name = "DamienMusic241"\ninclude ":app"\n' > settings.gradle

      - name: build.gradle
        run: |
          printf 'buildscript {\n    ext.kotlin_version = "1.9.10"\n    repositories { google(); mavenCentral() }\n    dependencies {\n        classpath "com.android.tools.build:gradle:8.1.4"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"\n    }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle

      - name: app/build.gradle
        run: |
          printf 'plugins {\n    id "com.android.application"\n    id "kotlin-android"\n}\nandroid {\n    namespace "com.damienmusic.app"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.damienmusic.app"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n            signingConfig signingConfigs.debug\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = "17" }\n}\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "androidx.recyclerview:recyclerview:1.3.2"\n    implementation "androidx.media3:media3-exoplayer:1.2.1"\n    implementation "androidx.media3:media3-ui:1.2.1"\n    implementation "com.github.bumptech.glide:glide:4.16.0"\n}\n' > app/build.gradle

      - name: AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'XMLEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:label="Damien Music 241"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden"/>
              </application>
          </manifest>
          XMLEOF

      - name: MainActivity.kt
        run: |
          cat > app/src/main/java/com/damienmusic/app/MainActivity.kt << 'KOTLIN_END'
          package com.damienmusic.app

          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.AlphaAnimation
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide

          data class Song(val id: Long, val title: String, val artist: String, val album: String, val duration: Long)

          class MainActivity : AppCompatActivity() {
              private val ACCENT = Color.parseColor("#E50914")
              private val GOLD = Color.parseColor("#FBBF24")
              private val TEXT = Color.WHITE
              private val MUTED = Color.parseColor("#8B96B8")

              private val allSongs = mutableListOf<Song>()
              private val songs = mutableListOf<Song>()
              private var adapter: SongAdapter? = null
              private var currentTab = 0
              private lateinit var bgImage: ImageView
              private var bgIndex = 0
              private val handler = Handler(Looper.getMainLooper())

              private val bgImages = listOf(
                  "https://loremflickr.com/1080/1920/music,concert",
                  "https://loremflickr.com/1080/1920/guitar",
                  "https://loremflickr.com/1080/1920/piano",
                  "https://loremflickr.com/1080/1920/gabon,forest",
                  "https://loremflickr.com/1080/1920/vinyl,record",
                  "https://loremflickr.com/1080/1920/headphones",
                  "https://loremflickr.com/1080/1920/elephant,africa",
                  "https://loremflickr.com/1080/1920/microphone"
              )

              private fun flagView(): View {
                  val v = View(this)
                  v.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(Color.parseColor("#009E60"), Color.parseColor("#009E60"),
                          Color.parseColor("#FCD116"), Color.parseColor("#FCD116"),
                          Color.parseColor("#3A75C4"), Color.parseColor("#3A75C4")))
                  return v
              }

              private fun tvLogoView(): View {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  val tvBody = FrameLayout(this)
                  val g = GradientDrawable()
                  g.setColor(ACCENT); g.cornerRadius = 16f
                  tvBody.background = g
                  val screen = FrameLayout(this)
                  val sg = GradientDrawable()
                  sg.setColor(Color.parseColor("#0B0F1A")); sg.cornerRadius = 8f
                  screen.background = sg
                  val d = TextView(this).apply {
                      text = "D"; setTextColor(TEXT); textSize = 40f
                      gravity = Gravity.CENTER
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }
                  screen.addView(d, FrameLayout.LayoutParams(-1, -1))
                  val lp = FrameLayout.LayoutParams(-1, -1)
                  lp.setMargins(14, 14, 14, 14)
                  tvBody.addView(screen, lp)
                  container.addView(tvBody, LinearLayout.LayoutParams(150, 120))
                  val legs = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
                  legs.addView(View(this).apply { setBackgroundColor(ACCENT) }, LinearLayout.LayoutParams(20, 12))
                  legs.addView(View(this), LinearLayout.LayoutParams(80, 12))
                  legs.addView(View(this).apply { setBackgroundColor(ACCENT) }, LinearLayout.LayoutParams(20, 12))
                  container.addView(legs)
                  return container
              }

              private fun startBackgroundCycling() {
                  val runnable = object : Runnable {
                      override fun run() {
                          Glide.with(this@MainActivity).load(bgImages[bgIndex % bgImages.size]).into(bgImage)
                          val fade = AlphaAnimation(0f, 1f)
                          fade.duration = 1200
                          bgImage.startAnimation(fade)
                          bgIndex++
                          handler.postDelayed(this, 6000)
                      }
                  }
                  handler.post(runnable)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.TRANSPARENT

                  val root = FrameLayout(this)

                  bgImage = ImageView(this)
                  bgImage.scaleType = ImageView.ScaleType.CENTER_CROP
                  bgImage.layoutParams = FrameLayout.LayoutParams(-1, -1)
                  root.addView(bgImage)

                  val overlay = View(this)
                  overlay.setBackgroundColor(Color.parseColor("#CC0B0F1A"))
                  overlay.layoutParams = FrameLayout.LayoutParams(-1, -1)
                  root.addView(overlay)

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(30, 50, 30, 24); gravity = Gravity.CENTER_VERTICAL }
                  header.addView(tvLogoView())
                  val titleCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(28, 0, 0, 0) }
                  val titleRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  titleRow.addView(TextView(this).apply {
                      text = "Damien Music 241"; setTextColor(TEXT); textSize = 22f
                      setTypeface(null, android.graphics.Typeface.BOLD) })
                  titleRow.addView(View(this), LinearLayout.LayoutParams(16, 1))
                  titleRow.addView(flagView(), LinearLayout.LayoutParams(72, 46))
                  titleCol.addView(titleRow)
                  titleCol.addView(TextView(this).apply {
                      text = "PROTOTYPE NEYLA 241"; setTextColor(GOLD); textSize = 12f
                      setPadding(0, 6, 0, 0) })
                  header.addView(titleCol)
                  content.addView(header)

                  // Bandeau défilant
                  val banner = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#66009E60")) }
                  banner.addView(flagView(), LinearLayout.LayoutParams(40, 26).apply { setMargins(20, 0, 16, 0) })
                  val marquee = TextView(this).apply {
                      text = "Cette application est construite 100% gabonaise  •  Concu par Damien Starly Koumba  •  Prototype Neyla 241  •  "
                      setTextColor(TEXT); textSize = 13f
                      setSingleLine(true)
                      ellipsize = android.text.TextUtils.TruncateAt.MARQUEE
                      marqueeRepeatLimit = -1
                      isSelected = true; isFocusable = true; isFocusableInTouchMode = true
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 8) }
                  banner.addView(marquee, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  banner.addView(flagView(), LinearLayout.LayoutParams(40, 26).apply { setMargins(16, 0, 20, 0) })
                  content.addView(banner)

                  // Statistiques
                  val statsTv = TextView(this).apply {
                      text = "Chargement de votre musique..."
                      setTextColor(GOLD); textSize = 14f; gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 10); setTypeface(null, android.graphics.Typeface.BOLD) }
                  content.addView(statsTv)

                  // Barre de recherche
                  val search = EditText(this).apply {
                      setTextColor(TEXT); setHintTextColor(MUTED)
                      hint = "Rechercher un titre, un artiste..."
                      textSize = 15f
                      setBackgroundColor(Color.parseColor("#CC151B2B"))
                      setPadding(28, 28, 28, 28) }
                  val slp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT)
                  slp.setMargins(24, 8, 24, 16)
                  search.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) { filter(s.toString()) }
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {} })
                  content.addView(search, slp)

                  // Liste des musiques
                  val rv = RecyclerView(this)
                  rv.layoutManager = LinearLayoutManager(this)
                  rv.setBackgroundColor(Color.parseColor("#990B0F1A"))
                  adapter = SongAdapter(songs) { s, index ->
                      val i = Intent(this@MainActivity, PlayerActivity::class.java)
                      i.putExtra("song_index", index)
                      startActivity(i) }
                  rv.adapter = adapter
                  content.addView(rv, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  // Crédit
                  content.addView(TextView(this).apply {
                      text = "Concu par Damien Starly Koumba"
                      setTextColor(TEXT); textSize = 13f; gravity = Gravity.CENTER
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 16, 0, 4) })
                  content.addView(TextView(this).apply {
                      text = "PROTOTYPE NEYLA 241 - 100% GABONAISE"
                      setTextColor(GOLD); textSize = 11f; gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 16) })

                  root.addView(content)
                  setContentView(root)

                  startBackgroundCycling()
                  requestPermissionAndLoad()
              }

              private fun requestPermissionAndLoad() {
                  val perm = if (Build.VERSION.SDK_INT >= 33)
                      Manifest.permission.READ_MEDIA_AUDIO
                  else Manifest.permission.READ_EXTERNAL_STORAGE

                  if (ContextCompat.checkSelfPermission(this, perm) == PackageManager.PERMISSION_GRANTED) {
                      loadSongs()
                  } else {
                      ActivityCompat.requestPermissions(this, arrayOf(perm), 100)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 && grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadSongs()
                  } else {
                      Toast.makeText(this, "Permission refusee - impossible de lire la musique",
                          Toast.LENGTH_LONG).show()
                  }
              }

              private fun loadSongs() {
                  Thread {
                      val list = mutableListOf<Song>()
                      val proj = arrayOf(
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM,
                          MediaStore.Audio.Media.DURATION
                      )
                      val cursor = contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          proj, null, null,
                          MediaStore.Audio.Media.TITLE + " ASC")
                      cursor?.use {
                          val idCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val tCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val aCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val alCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val dCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          while (it.moveToNext()) {
                              list.add(Song(
                                  it.getLong(idCol),
                                  it.getString(tCol) ?: "Inconnu",
                                  it.getString(aCol) ?: "Inconnu",
                                  it.getString(alCol) ?: "Inconnu",
                                  it.getLong(dCol)
                              ))
                          }
                      }
                      runOnUiThread {
                          allSongs.clear()
                          allSongs.addAll(list)
                          songs.clear()
                          songs.addAll(list)
                          adapter?.notifyDataSetChanged()
                          Toast.makeText(this, "${list.size} musique(s) trouvee(s)", Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }

              private fun filter(q: String) {
                  songs.clear()
                  if (q.isEmpty()) songs.addAll(allSongs)
                  else songs.addAll(allSongs.filter {
                      it.title.contains(q, true) || it.artist.contains(q, true) })
                  adapter?.notifyDataSetChanged()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
              }
          }

          class SongAdapter(
              private val items: List<Song>,
              private val onClick: (Song, Int) -> Unit
          ) : RecyclerView.Adapter<SongAdapter.VH>() {
              class VH(v: View) : RecyclerView.ViewHolder(v)
              override fun onCreateViewHolder(parent: android.view.ViewGroup, viewType: Int): VH {
                  val ctx = parent.context
                  val row = LinearLayout(ctx).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(32, 22, 32, 22)
                      layoutParams = RecyclerView.LayoutParams(
                          RecyclerView.LayoutParams.MATCH_PARENT,
                          RecyclerView.LayoutParams.WRAP_CONTENT)
                      isClickable = true
                      setBackgroundColor(Color.parseColor("#B30B0F1A")) }
                  val icon = TextView(ctx).apply {
                      text = "♪"; setTextColor(Color.parseColor("#FBBF24"))
                      textSize = 32f; gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(80, 80) }
                  val col = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(24, 0, 0, 0) }
                  val t = TextView(ctx).apply {
                      setTextColor(Color.WHITE); textSize = 16f
                      setTypeface(null, android.graphics.Typeface.BOLD) }
                  val a = TextView(ctx).apply {
                      setTextColor(Color.parseColor("#8B96B8")); textSize = 13f
                      setPadding(0, 6, 0, 0) }
                  col.addView(t); col.addView(a)
                  row.addView(icon)
                  row.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  return VH(row) }
              override fun onBindViewHolder(holder: VH, position: Int) {
                  val s = items[position]
                  val row = holder.itemView as LinearLayout
                  val col = row.getChildAt(1) as LinearLayout
                  (col.getChildAt(0) as TextView).text = s.title
                  val dur = s.duration / 1000
                  (col.getChildAt(1) as TextView).text = "${s.artist} - ${s.album}  •  ${dur / 60}:${(dur % 60).toString().padStart(2, '0')}"
                  row.setOnClickListener { onClick(s, position) } }
              override fun getItemCount() = items.size
          }
          KOTLIN_END

      - name: PlayerActivity.kt
        run: |
          cat > app/src/main/java/com/damienmusic/app/PlayerActivity.kt << 'KOTLIN_END'
          package com.damienmusic.app

          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory

          class PlayerActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private var isPlaying = false
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.BLACK

                  val BG = Color.parseColor("#0B0F1A")
                  val ACCENT = Color.parseColor("#E50914")
                  val GOLD = Color.parseColor("#FBBF24")
                  val TEXT = Color.WHITE
                  val MUTED = Color.parseColor("#8B96B8")

                  val songIndex = intent.getIntExtra("song_index", 0)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG)
                      gravity = Gravity.CENTER
                      setPadding(48, 80, 48, 80) }

                  root.addView(TextView(this).apply {
                      text = "🎵"; textSize = 130f; gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 30) })

                  root.addView(TextView(this).apply {
                      text = "Damien Music 241"
                      setTextColor(GOLD); textSize = 14f; gravity = Gravity.CENTER
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 0, 0, 60) })

                  root.addView(TextView(this).apply {
                      text = "Lecture en cours"
                      setTextColor(TEXT); textSize = 22f; gravity = Gravity.CENTER
                      setTypeface(null, android.graphics.Typeface.BOLD) })

                  root.addView(TextView(this).apply {
                      text = "Depuis votre telephone"
                      setTextColor(MUTED); textSize = 14f; gravity = Gravity.CENTER
                      setPadding(0, 12, 0, 60) })

                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER }

                  val playBtn = TextView(this).apply {
                      text = "⏸"; setTextColor(TEXT); textSize = 40f
                      gravity = Gravity.CENTER; setBackgroundColor(ACCENT)
                      setPadding(60, 40, 60, 40)
                      setOnClickListener {
                          if (isPlaying) { player?.pause(); text = "▶"; isPlaying = false }
                          else { player?.play(); text = "⏸"; isPlaying = true } } }

                  btnRow.addView(playBtn)
                  root.addView(btnRow)

                  root.addView(TextView(this).apply {
                      text = "Concu par Damien Starly Koumba"
                      setTextColor(MUTED); textSize = 12f; gravity = Gravity.CENTER
                      setPadding(0, 80, 0, 8) })
                  root.addView(TextView(this).apply {
                      text = "PROTOTYPE NEYLA 241"
                      setTextColor(GOLD); textSize = 11f; gravity = Gravity.CENTER })

                  setContentView(root)

                  // Note : pour la vraie lecture, on a besoin des URI de la musique
                  // Cette version sert de base - la prochaine version utilisera les vraies URI
              }

              override fun onDestroy() { super.onDestroy(); player?.release(); player = null }
          }
          KOTLIN_END

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/damien-music-241.apk

      - name: Envoyer
        uses: actions/upload-artifact@v4
        with:
          name: damien-music-241-apk
          path: output/damien-music-241.apk
